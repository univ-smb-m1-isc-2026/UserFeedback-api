name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Donner les droits d'exécution à mvnw
        run: chmod +x mvnw

      - name: Lancer les tests Maven
        run: ./mvnw test

      - name: Builder l'application
        run: ./mvnw clean package -DskipTests